<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Meylo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<style>
body{padding:24px;max-width:800px;margin:0 auto}
.admin-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
.admin-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.admin-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(255,45,111,0.15);color:var(--accent);margin-bottom:6px}
.admin-btn{padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;border:1px solid var(--border);background:#181818;color:#fff;cursor:pointer;margin-left:6px}
.admin-btn.danger{border-color:#f44336;color:#f44336}
.admin-btn.warn{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>
<h1 style="font-family:'Syne',sans-serif;font-size:24px;margin-bottom:20px">🛡️ Meylo Admin</h1>

<div id="loginBox" class="admin-card">
    <h3 style="margin-bottom:10px">Admin Login</h3>
    <div class="form-group"><input type="email" id="aEmail" class="form-control" placeholder="Admin email"></div>
    <div class="form-group" style="margin-top:8px"><input type="password" id="aPass" class="form-control" placeholder="Password"></div>
    <button class="btn-primary" style="margin-top:10px" onclick="adminLogin()">Log In</button>
    <p id="loginErr" style="color:#f44336;font-size:12px;margin-top:8px"></p>
</div>

<div id="dashBox" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <p style="font-size:13px;color:var(--fg-muted)">Logged in as <span id="adminEmailShown"></span></p>
        <button class="admin-btn" onclick="firebase.auth().signOut().then(()=>location.reload())">Log Out</button>
    </div>
    <div id="reportsList"><p style="color:var(--fg-muted)">Loading reports...</p></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCakONYwg8WAkoSxFBp_B7CuPRI0ONfq6Y",
  authDomain: "meylo-a6e64.firebaseapp.com",
  databaseURL: "https://meylo-a6e64-default-rtdb.firebaseio.com",
  projectId: "meylo-a6e64",
  storageBucket: "meylo-a6e64.firebasestorage.app",
  messagingSenderId: "854696371817",
  appId: "1:854696371817:web:ad85a9db4ce063f60464f8"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

function escapeHTML(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function adminLogin() {
    const email = document.getElementById('aEmail').value.trim();
    const pass = document.getElementById('aPass').value;
    document.getElementById('loginErr').innerText = '';
    try {
        await auth.signInWithEmailAndPassword(email, pass);
    } catch (err) {
        document.getElementById('loginErr').innerText = 'Login failed — check email/password.';
    }
}

auth.onAuthStateChanged(async (user) => {
    if (!user) {
        document.getElementById('loginBox').style.display = 'block';
        document.getElementById('dashBox').style.display = 'none';
        return;
    }
    document.getElementById('adminEmailShown').innerText = user.email;
    const idToken = await user.getIdToken();

    const resp = await fetch('/api/admin', { headers: { 'Authorization': 'Bearer ' + idToken } });
    const data = await resp.json();

    if (!resp.ok) {
        document.getElementById('loginBox').style.display = 'block';
        document.getElementById('dashBox').style.display = 'none';
        document.getElementById('loginErr').innerText = data.error === 'Not authorized'
            ? 'This account is not an admin.' : (data.error || 'Error loading reports');
        auth.signOut();
        return;
    }

    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dashBox').style.display = 'block';
    renderReports(data.reports, idToken);
});

async function renderReports(reports, idToken) {
    const box = document.getElementById('reportsList');
    if (!reports.length) {
        box.innerHTML = '<p style="color:var(--fg-muted)">No open reports 🎉</p>';
        return;
    }

    const uids = [...new Set(reports.flatMap(r => [r.reporterId, r.reportedId]))];
    const names = {};
    await Promise.all(uids.map(async uid => {
        const snap = await db.ref(`users/${uid}/name`).once('value');
        names[uid] = snap.val() || uid;
    }));

    box.innerHTML = reports.map(r => `
        <div class="admin-card">
            <span class="admin-badge">${escapeHTML(r.reason)}</span>
            <div class="admin-row">
                <div>
                    <p style="font-size:13px"><strong>Reported:</strong> ${escapeHTML(names[r.reportedId])} <span style="color:#555;font-size:11px">(${escapeHTML(r.reportedId)})</span></p>
                    <p style="font-size:12px;color:var(--fg-muted)">By ${escapeHTML(names[r.reporterId])} — ${new Date(r.timestamp).toLocaleString()}</p>
                </div>
            </div>
            <div style="margin-top:10px;text-align:right">
                <button class="admin-btn" onclick="doAction('dismiss','${r.reportedId}','${r.id}', this)">Dismiss</button>
                <button class="admin-btn warn" onclick="doAction('disable','${r.reportedId}','${r.id}', this)">Disable Account</button>
                <button class="admin-btn danger" onclick="if(confirm('Permanently delete this account?')) doAction('delete','${r.reportedId}','${r.id}', this)">Delete Account</button>
            </div>
        </div>
    `).join('');
}

async function doAction(action, targetUid, reportId, btnEl) {
    const idToken = await auth.currentUser.getIdToken();
    btnEl.closest('.admin-card').style.opacity = '0.5';
    const resp = await fetch('/api/admin', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + idToken, 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, targetUid, reportId })
    });
    if (resp.ok) {
        btnEl.closest('.admin-card').remove();
    } else {
        btnEl.closest('.admin-card').style.opacity = '1';
        alert('Action failed');
    }
}
</script>
</body>
</html>
